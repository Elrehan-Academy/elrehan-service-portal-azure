name: esp

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${ESP_DB_NAME:-itop}
      MARIADB_USER: ${ESP_DB_USER:-itop}
      MARIADB_PASSWORD: ${ESP_DB_PASSWORD:?ESP_DB_PASSWORD is required}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=256M

    volumes:
      - db-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ITOP_VERSION: ${ITOP_VERSION:-3.3.0-21411}

    image: ${ESP_IMAGE:-local/esp:latest}
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      ESP_DB_HOST: db
      ESP_DB_USER: ${ESP_DB_USER:-itop}
      ESP_DB_PASSWORD: ${ESP_DB_PASSWORD:?ESP_DB_PASSWORD is required}
      ESP_DB_NAME: ${ESP_DB_NAME:-itop}
      ESP_URL: ${ESP_URL:?ESP_URL is required}
      ESP_ADMIN_USER: ${ESP_ADMIN_USER:-admin}
      ESP_ADMIN_PASSWORD: ${ESP_ADMIN_PASSWORD:?ESP_ADMIN_PASSWORD is required}

    ports:
      - "${ESP_BIND_ADDRESS:-127.0.0.1}:${ESP_HTTP_PORT:-8080}:80"

    volumes:
      - esp-conf:/var/www/html/conf
      - esp-data:/var/www/html/data
      - esp-env-production:/var/www/html/env-production

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /var/www/html/conf/production/config-itop.php &&
          test -s /var/www/html/data/datamodel-production.xml &&
          test -s /var/www/html/data/instance.txt &&
          test -d /var/www/html/env-production &&
          find /var/www/html/env-production -iname "*elrehan*" -print -quit | grep -q . &&
          php -r '$$c=@file_get_contents("http://127.0.0.1/pages/UI.php");
          exit($$c !== false && strpos($$c, "Elrehan Service Portal") !== false ? 0 : 1);'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  db-data:
  esp-conf:
  esp-data:
  esp-env-production:
